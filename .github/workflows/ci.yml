name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate docker-compose
        run: docker compose -f ../docker-compose.yml config -q

      - name: Build and test
        run: ./mvnw -B verify

      - name: Check OpenAPI spec is up to date
        run: |
            if [ -n "$(git status --porcelain ../docs/api)" ]; then
              echo "::error::docs/api/openapi.json güncel değil. './mvnw verify' çalıştırıp güncel spec'i commit'le."
              git diff ../docs/api
              exit 1
            fi
