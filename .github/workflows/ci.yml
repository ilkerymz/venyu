name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate docker-compose
        run: docker compose -f ../docker-compose.yml config -q

      - name: Build and test
        run: ./mvnw -B verify

      - name: Check OpenAPI spec is up to date
        run: |
            if [ -n "$(git status --porcelain ../docs/api)" ]; then
              echo "::error::docs/api/openapi.json güncel değil. './mvnw verify' çalıştırıp güncel spec'i commit'le."
              git diff ../docs/api
              exit 1
            fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check API client is up to date
        run: |
          pnpm api:generate
          if [ -n "$(git status --porcelain src/api/generated)" ]; then
            echo "::error::src/api/generated güncel değil. 'cd frontend && pnpm api:generate' çalıştırıp üretilen client'ı commit'le."
            git status --porcelain src/api/generated
            exit 1
          fi

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
