springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
spring:
  application:
    name: venyu
  datasource:
    url: jdbc:postgresql://localhost:5433/venyu
    username: venyu
    password: venyu
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      completion-mode: delete
      # Uygulama yeniden başlarken tamamlanmamış event'leri (listener hata verdi / uygulama çöktü) tekrar yayınla.
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

venyu:
  jwt:
    secret: ${VENYU_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  notification:
    frontend-url: http://localhost:3000
